<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="1360" height="880" role="img" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif">
<title>Four agents each run their own improvement loop; one raises a coral flag because two metrics trade, the others keep cycling.</title>
<style>
.t{fill:#DCE7E2;font-size:14px;font-weight:500} .s{fill:#8FA39B;font-size:12px} .c{text-anchor:middle;dominant-baseline:central}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="680" height="440" rx="16" fill="#0E1412"/>
<text x="40" y="44" class="t">One loop raises a hand, the rest keep running</text><text x="40" y="64" class="s">Each agent improves on its own loop. A flag pauses only the agent that needs a human</text><text x="40" y="117" class="t">rca-agent</text><rect x="170" y="98" width="300" height="28" rx="14" fill="none" stroke="#26332E" stroke-width="8"/><circle r="7" fill="#14B88A"><animateMotion dur="5.0s" repeatCount="indefinite" path="M184 98 H456 A14 14 0 0 1 456 126 H184 A14 14 0 0 1 184 98"/></circle><text x="492" y="117" class="s">running</text><text x="40" y="189" class="t">triage-agent</text><rect x="170" y="170" width="300" height="28" rx="14" fill="none" stroke="#26332E" stroke-width="8"/><circle r="7" fill="#14B88A"><animateMotion dur="6.5s" repeatCount="indefinite" path="M184 170 H456 A14 14 0 0 1 456 198 H184 A14 14 0 0 1 184 170"/></circle><text x="492" y="189" class="s">running</text><text x="40" y="261" class="t">cost-agent</text><rect x="170" y="242" width="300" height="28" rx="14" fill="none" stroke="#26332E" stroke-width="8"/><circle r="7" fill="#14B88A"><animateMotion dur="12s" repeatCount="indefinite" path="M184 242 H456 A14 14 0 0 1 456 270 H184 A14 14 0 0 1 184 242" keyPoints="0;0.45;0.45;1" keyTimes="0;0.3;0.75;1" calcMode="linear"/><animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3;0.75" values="#14B88A;#FF6B3D;#14B88A"/></circle><g class="flag"><line x1="492" y1="270" x2="492" y2="234" stroke="#DCE7E2" stroke-width="1.5"/><path d="M492 234 L520 241 L492 248 Z" fill="#FF6B3D"/><text x="530" y="241" class="s" style="fill:#FF6B3D;dominant-baseline:central">needs a human</text><text x="530" y="260" class="s" style="dominant-baseline:central">two metrics trade</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3;0.75" values="0;1;0"/></g><text x="40" y="333" class="t">review-agent</text><rect x="170" y="314" width="300" height="28" rx="14" fill="none" stroke="#26332E" stroke-width="8"/><circle r="7" fill="#14B88A"><animateMotion dur="5.6s" repeatCount="indefinite" path="M184 314 H456 A14 14 0 0 1 456 342 H184 A14 14 0 0 1 184 314"/></circle><text x="492" y="333" class="s">running</text><text x="40" y="420" class="s">The human answered once, set the limits once. Everything else is automatic.</text>
</svg>