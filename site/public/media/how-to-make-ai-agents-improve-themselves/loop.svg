<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="1360" height="800" role="img" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif">
<title>The self-improvement loop: runs are graded, collected, a coach proposes one change, the candidate is replayed against the noise band, shadowed and promoted. Two of three candidates are reverted.</title>
<style>
.t{fill:#DCE7E2;font-size:14px;font-weight:500} .s{fill:#8FA39B;font-size:12px} .c{text-anchor:middle;dominant-baseline:central}
.flow{animation:flow 1.2s linear infinite} @keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="680" height="400" rx="16" fill="#0E1412"/>
<text x="40" y="44" class="t">The self-improvement loop</text><text x="40" y="64" class="s">Three candidates, one cycle: two fail the noise band and are reverted, one is promoted</text><path d="M110 120 H569 V300 H110 V120" fill="none" stroke="#26332E" stroke-width="10" stroke-linejoin="round"/><path d="M110 120 H569 V300 H110 V120" fill="none" stroke="#14B88A" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 10" class="flow"/><rect x="46.0" y="94.0" width="128" height="52" rx="10" fill="#0F3D31" stroke="#14B88A" stroke-width="1"/><text x="110" y="112" class="t c">Production runs</text><text x="110" y="131" class="s c">every run recorded</text><rect x="199.0" y="94.0" width="128" height="52" rx="10" fill="#0F3D31" stroke="#14B88A" stroke-width="1"/><text x="263" y="112" class="t c">Grade</text><text x="263" y="131" class="s c">judge + human edits</text><rect x="352.0" y="94.0" width="128" height="52" rx="10" fill="#0F3D31" stroke="#14B88A" stroke-width="1"/><text x="416" y="112" class="t c">Datasets</text><text x="416" y="131" class="s c">replayable</text><rect x="505.0" y="94.0" width="128" height="52" rx="10" fill="#0F3D31" stroke="#14B88A" stroke-width="1"/><text x="569" y="112" class="t c">Coach</text><text x="569" y="131" class="s c">proposes one change</text><rect x="46.0" y="274.0" width="128" height="52" rx="10" fill="#0F3D31" stroke="#FF6B3D" stroke-width="1"/><text x="110" y="292" class="t c">Promote</text><text x="110" y="311" class="s c">rule, or a flag</text><rect x="199.0" y="274.0" width="128" height="52" rx="10" fill="#0F3D31" stroke="#14B88A" stroke-width="1"/><text x="263" y="292" class="t c">Shadow</text><text x="263" y="311" class="s c">live, caller unaware</text><rect x="352.0" y="274.0" width="128" height="52" rx="10" fill="#0F3D31" stroke="#14B88A" stroke-width="1"/><text x="416" y="292" class="t c">Replay</text><text x="416" y="311" class="s c">k runs vs noise band</text><rect x="505.0" y="274.0" width="128" height="52" rx="10" fill="#0F3D31" stroke="#14B88A" stroke-width="1"/><text x="569" y="292" class="t c">Candidate</text><text x="569" y="311" class="s c">new revision</text><rect x="360" y="360" width="112" height="26" rx="6" fill="none" stroke="#56645F" stroke-dasharray="3 3"/><text x="416" y="373" class="s c">reverted</text><circle r="9" fill="#14B88A" stroke="#0E1412" stroke-width="2"><animateMotion dur="18s" repeatCount="indefinite" path="M110 120 H569 V300 H416 V370" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0111;0.2556;1"/><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0111;0.0121;0.2556;0.2566;1" values="0;0;1;1;0;0"/><animate attributeName="fill" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2111" values="#14B88A;#56645F"/></circle><circle r="9" fill="#14B88A" stroke="#0E1412" stroke-width="2"><animateMotion dur="18s" repeatCount="indefinite" path="M110 120 H569 V300 H416 V370" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3444;0.5889;1"/><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3444;0.3454;0.5889;0.5899;1" values="0;0;1;1;0;0"/><animate attributeName="fill" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5444" values="#14B88A;#56645F"/></circle><circle r="9" fill="#14B88A" stroke="#0E1412" stroke-width="2"><animateMotion dur="18s" repeatCount="indefinite" path="M110 120 H569 V300 H110 V120" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6778;0.9778;1"/><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6778;0.6788;0.9778;0.9788;1" values="0;0;1;1;0;0"/><animate attributeName="fill" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.8500" values="#14B88A;#FF6B3D"/></circle><g opacity="0"><rect x="368" y="239" width="96" height="26" rx="13" fill="#56645F"/><text x="416" y="252" class="c" style="fill:#0E1412;font-size:12px;font-weight:600">inside noise</text><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2167;0.3222" values="0;1;0"/></g><g opacity="0"><rect x="368" y="239" width="96" height="26" rx="13" fill="#56645F"/><text x="416" y="252" class="c" style="fill:#0E1412;font-size:12px;font-weight:600">inside noise</text><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5500;0.6556" values="0;1;0"/></g><g opacity="0"><rect x="368" y="239" width="96" height="26" rx="13" fill="#FF6B3D"/><text x="416" y="252" class="c" style="fill:#0E1412;font-size:12px;font-weight:600">beats noise</text><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.8500;0.9667" values="0;1;0"/></g><g opacity="0"><rect x="62" y="239" width="96" height="26" rx="13" fill="#FF6B3D"/><text x="110" y="252" class="c" style="fill:#0E1412;font-size:12px;font-weight:600">promoted</text><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.9444;0.9972" values="0;1;0"/></g>
</svg>