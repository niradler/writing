<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="1360" height="800" role="img" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif">
<title>Two bars: on the cases the coach saw, +19 points beats a 14 point noise band; on 16 fresh cases, +16 points sits inside a 20 point band.</title>
<style>
.t{fill:#DCE7E2;font-size:14px;font-weight:500} .s{fill:#8FA39B;font-size:12px} .c{text-anchor:middle;dominant-baseline:central}
.grow{animation:grow 7s ease-out infinite;transform:scaleY(0)} @keyframes grow{0%{transform:scaleY(0)}25%{transform:scaleY(1)}90%{transform:scaleY(1)}100%{transform:scaleY(0)}}.fade{animation:fade 7s ease-out infinite;opacity:0} @keyframes fade{0%,20%{opacity:0}30%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="680" height="400" rx="16" fill="#0E1412"/>
<text x="40" y="44" class="t">The coach learned the grader, not the job</text><text x="40" y="64" class="s">Accuracy gain in points. The gray band is the gain you would see from noise alone</text><line x1="70" y1="300" x2="640" y2="300" stroke="#8FA39B"/><rect x="90" y="174.0" width="180" height="126.0" fill="#56645F" fill-opacity=".25"/><line x1="90" y1="174.0" x2="270" y2="174.0" stroke="#8FA39B" stroke-dasharray="4 4"/><text x="276" y="174.0" class="s" style="dominant-baseline:central">noise 14 pts</text><rect x="146" y="129.0" width="68" height="171.0" rx="4" fill="#FF6B3D" class="grow" style="transform-origin:180px 300px;animation-delay:0.0s"/><text x="180" y="115.0" class="t c fade" style="animation-delay:0.0s">+19 pts</text><text x="180" y="322" class="t c">Cases the coach saw</text><text x="180" y="340" class="s c">31 cases, 2 runs each</text><text x="180" y="362" class="s c fade" style="fill:#FF6B3D;animation-delay:0.0s">beats the noise</text><rect x="370" y="120.0" width="180" height="180.0" fill="#56645F" fill-opacity=".25"/><line x1="370" y1="120.0" x2="550" y2="120.0" stroke="#8FA39B" stroke-dasharray="4 4"/><text x="556" y="120.0" class="s" style="dominant-baseline:central">noise 20 pts</text><rect x="426" y="156.0" width="68" height="144.0" rx="4" fill="#56645F" class="grow" style="transform-origin:460px 300px;animation-delay:1.2s"/><text x="460" y="142.0" class="t c fade" style="animation-delay:1.2s">+16 pts</text><text x="460" y="322" class="t c">Fresh cases it never saw</text><text x="460" y="340" class="s c">16 cases, 2 runs each</text><text x="460" y="362" class="s c fade" style="fill:#8FA39B;animation-delay:1.2s">inside the noise</text>
</svg>