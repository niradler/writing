<rect width="1000" height="536" rx="16" fill="#0E1412"/>
<line x1="504" y1="50" x2="504" y2="514" stroke="#26332E"/>
<text x="30" y="34" font-size="16" font-weight="600" fill="#DCE7E2">Without a hub (by hand)</text>
<text x="530" y="34" font-size="16" font-weight="600" fill="#DCE7E2">With a hub (ORC)</text>
<rect x="30" y="70" width="170" height="56" rx="9" fill="#16201C" stroke="#B39DDB" stroke-width="2"/><text x="115" y="95" text-anchor="middle" font-weight="600" font-size="13" fill="#DCE7E2">Supervisor agent</text><text x="115" y="111" text-anchor="middle" font-size="10.5" fill="#8FA39B">tool A, model A</text>
<rect x="290" y="70" width="180" height="56" rx="9" fill="#16201C" stroke="#5AA9E6" stroke-width="2"/><text x="380" y="95" text-anchor="middle" font-weight="600" font-size="13" fill="#DCE7E2">Executor agent</text><text x="380" y="111" text-anchor="middle" font-size="10.5" fill="#8FA39B">tool B, model B</text>
<rect x="30" y="230" width="440" height="112" rx="9" fill="#121A17" stroke="#3A4A44" stroke-width="2"/>
<text x="45" y="253" font-size="12" fill="#8FA39B">files in the repo (the only thing both can touch)</text>
<text x="45" y="279" font-size="11.5" font-family="IBM Plex Mono, Menlo, monospace" fill="#DCE7E2">to_supervisor.md  REPORT | QUESTION | BLOCKED | DONE</text>
<text x="45" y="301" font-size="11.5" font-family="IBM Plex Mono, Menlo, monospace" fill="#DCE7E2">to_executor.md    GUIDE | ANSWER, ack: time</text>
<text x="45" y="323" font-size="11.5" font-family="IBM Plex Mono, Menlo, monospace" fill="#DCE7E2">WAITING           pause flag   STATUS.md  stop word</text>
<rect x="290" y="400" width="180" height="56" rx="9" fill="#16201C" stroke="#8FA39B" stroke-width="2"/><text x="380" y="425" text-anchor="middle" font-weight="600" font-size="13" fill="#DCE7E2">driver loop</text><text x="380" y="441" text-anchor="middle" font-size="10.5" fill="#8FA39B">one step per run</text>
<line x1="115" y1="126" x2="115" y2="228" stroke="#B39DDB" stroke-width="1.8" marker-end="url(#a6a1b9a)"/><text x="123" y="180" font-size="11" fill="#B39DDB">watch / answer</text>
<line x1="380" y1="126" x2="380" y2="228" stroke="#5AA9E6" stroke-width="1.8" marker-end="url(#a1565c0)"/><text x="388" y="180" font-size="11" fill="#5AA9E6">append, commit</text>
<line x1="380" y1="400" x2="380" y2="344" stroke="#8FA39B" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a666)"/>
<text x="372" y="376" text-anchor="end" font-size="11" fill="#8FA39B">checks WAITING + STATUS.md</text>
<path d="M470,428 L488,428 L488,98 L472,98" fill="none" stroke="#8FA39B" stroke-width="1.8" marker-end="url(#a666)" stroke-dasharray="4 3"/>
<text x="280" y="424" text-anchor="end" font-size="11" fill="#8FA39B">starts one executor run</text>
<text x="280" y="439" text-anchor="end" font-size="11" fill="#8FA39B">per iteration (right path)</text>
<text x="30" y="484" font-size="11.5" fill="#8FA39B">hand-built: loop, pause, acks, ids</text>
<text x="30" y="501" font-size="11.5" fill="#FF6B6B">no liveness: failed runs go unnoticed</text>
<text x="30" y="518" font-size="11.5" fill="#FF6B6B">single-instance CLIs: no lock</text>
<ellipse cx="755" cy="275" rx="120" ry="78" fill="#0F3D31" stroke="#B39DDB" stroke-width="2"/>
<text x="755" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#DCE7E2">ORC hub</text>
<text x="755" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#DCE7E2">session registry</text>
<text x="755" y="268" text-anchor="middle" font-size="11" font-weight="400" fill="#DCE7E2">session_send inbox</text>
<text x="755" y="286" text-anchor="middle" font-size="11" font-weight="400" fill="#DCE7E2">session_start + notify</text>
<text x="755" y="304" text-anchor="middle" font-size="11" font-weight="400" fill="#DCE7E2">task board, human_request</text>
<text x="755" y="322" text-anchor="middle" font-size="11" font-weight="400" fill="#DCE7E2">memory / KB</text>
<rect x="540" y="70" width="140" height="56" rx="9" fill="#16201C" stroke="#14B88A" stroke-width="2"/><text x="610" y="95" text-anchor="middle" font-weight="600" font-size="13" fill="#DCE7E2">Claude Code</text><text x="610" y="111" text-anchor="middle" font-size="10.5" fill="#8FA39B">hook: mid-run messages</text>
<rect x="830" y="70" width="140" height="56" rx="9" fill="#16201C" stroke="#14B88A" stroke-width="2"/><text x="900" y="95" text-anchor="middle" font-weight="600" font-size="13" fill="#DCE7E2">Gemini CLI</text><text x="900" y="111" text-anchor="middle" font-size="10.5" fill="#8FA39B">hook + resume</text>
<rect x="540" y="420" width="140" height="56" rx="9" fill="#16201C" stroke="#14B88A" stroke-width="2"/><text x="610" y="445" text-anchor="middle" font-weight="600" font-size="13" fill="#DCE7E2">Codex</text><text x="610" y="461" text-anchor="middle" font-size="10.5" fill="#8FA39B">hook + resume</text>
<rect x="830" y="420" width="140" height="56" rx="9" fill="#16201C" stroke="#FF8A65" stroke-width="2"/><text x="900" y="445" text-anchor="middle" font-weight="600" font-size="13" fill="#DCE7E2">Cursor agent CLI</text><text x="900" y="461" text-anchor="middle" font-size="10.5" fill="#8FA39B">start + result</text>
