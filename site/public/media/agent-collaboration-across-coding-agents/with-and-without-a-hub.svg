<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 536" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif" role="img">
<title>Comparison of agent collaboration without a hub using repository files and a driver loop versus with an ORC hub connecting Claude Code, Gemini CLI, Codex, and Cursor agent CLI</title>
<defs>
<marker id="a2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14B88A"/></marker>
