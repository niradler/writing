<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
<rect width="900" height="460" fill="#fff"/>
<text x="110" y="30" font-size="16" font-weight="600" fill="#222">Six patterns for agent-to-agent work, by use case</text>
<line x1="110" y1="390" x2="860" y2="390" stroke="#777"/><line x1="110" y1="390" x2="110" y2="60" stroke="#777"/>
<text x="110" y="410" text-anchor="middle" fill="#777" font-size="12">minutes</text>
<text x="360" y="410" text-anchor="middle" fill="#777" font-size="12">an hour</text>
<text x="610" y="410" text-anchor="middle" fill="#777" font-size="12">hours</text>
<text x="860" y="410" text-anchor="middle" fill="#777" font-size="12">days</text>
<text x="485.0" y="434" text-anchor="middle" fill="#444">how long the work runs →</text>
<text x="100" y="394" text-anchor="end" fill="#777" font-size="12">hours</text>
<text x="100" y="229" text-anchor="end" fill="#777" font-size="12">minutes</text>
<text x="100" y="64" text-anchor="end" fill="#777" font-size="12">seconds</text>
<text x="30" y="225.0" text-anchor="middle" fill="#444" transform="rotate(-90 30 225.0)">how fast a decision must come back →</text>
<circle cx="170" cy="93" r="44" fill="#1565c0" opacity="0.12" stroke="#1565c0"/><text x="170" y="91" text-anchor="middle" font-weight="600" fill="#1565c0">Call and return</text><text x="170" y="108" text-anchor="middle" font-size="11" fill="#555">subagent, codex exec</text>
<circle cx="335" cy="142" r="44" fill="#00838f" opacity="0.12" stroke="#00838f"/><text x="335" y="140" text-anchor="middle" font-weight="600" fill="#00838f">Direct session messages</text><text x="335" y="158" text-anchor="middle" font-size="11" fill="#555">same tool, both live</text>
<circle cx="575" cy="242" r="44" fill="#ef6c00" opacity="0.12" stroke="#ef6c00"/><text x="575" y="240" text-anchor="middle" font-weight="600" fill="#ef6c00">File channel + driver loop</text><text x="575" y="256" text-anchor="middle" font-size="11" fill="#555">unattended, spend gates</text>
<circle cx="485" cy="340" r="44" fill="#2e7d32" opacity="0.12" stroke="#2e7d32"/><text x="485" y="338" text-anchor="middle" font-weight="600" fill="#2e7d32">Git as the channel</text><text x="485" y="356" text-anchor="middle" font-size="11" fill="#555">branch, PR review, CI gate</text>
<circle cx="770" cy="350" r="44" fill="#6a1b9a" opacity="0.12" stroke="#6a1b9a"/><text x="770" y="348" text-anchor="middle" font-weight="600" fill="#6a1b9a">Task board</text><text x="770" y="365" text-anchor="middle" font-size="11" fill="#555">many agents + humans, ORC</text>
<circle cx="610" cy="155" r="48" fill="#ad1457" opacity="0.12" stroke="#ad1457"/><text x="610" y="153" text-anchor="middle" font-weight="600" fill="#ad1457">Hub sessions</text><text x="610" y="170" text-anchor="middle" font-size="11" fill="#555">mixed tools, ORC</text><text x="860" y="452" text-anchor="end" font-size="11" fill="#777">patterns combine: most setups use two or three</text></svg>