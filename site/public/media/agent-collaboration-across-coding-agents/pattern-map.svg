<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif" role="img" font-size="13">
<title>Scatter map placing six agent collaboration patterns by task duration and required decision speed</title>
<rect width="900" height="476" rx="16" fill="#0E1412"/>
<text x="110" y="32" font-size="16" font-weight="600" fill="#DCE7E2">Six patterns for agent-to-agent work, by use case</text>
<line x1="110" y1="392" x2="866" y2="392" stroke="#8FA39B"/>
<line x1="110" y1="392" x2="110" y2="58" stroke="#8FA39B"/>
<text x="110" y="412" text-anchor="middle" fill="#8FA39B" font-size="12">minutes</text>
<text x="362" y="412" text-anchor="middle" fill="#8FA39B" font-size="12">an hour</text>
<text x="614" y="412" text-anchor="middle" fill="#8FA39B" font-size="12">hours</text>
<text x="866" y="412" text-anchor="middle" fill="#8FA39B" font-size="12">days</text>
<text x="488" y="436" text-anchor="middle" fill="#8FA39B">how long the work runs →</text>
<text x="100" y="396" text-anchor="end" fill="#8FA39B" font-size="12">hours</text>
<text x="100" y="230" text-anchor="end" fill="#8FA39B" font-size="12">minutes</text>
<text x="100" y="64" text-anchor="end" fill="#8FA39B" font-size="12">seconds</text>
<text x="30" y="225" text-anchor="middle" fill="#8FA39B" transform="rotate(-90 30 225)">how fast a decision must come back →</text>
<rect x="130" y="68" width="184" height="54" rx="14" fill="#5AA9E6" fill-opacity="0.14" stroke="#5AA9E6" stroke-width="1.5"/>
<text x="222" y="92" text-anchor="middle" font-weight="600" fill="#5AA9E6">Call and return</text>
<text x="222" y="110" text-anchor="middle" font-size="11" fill="#8FA39B">subagent, codex exec</text>
<rect x="256" y="136" width="204" height="54" rx="14" fill="#4DD0E1" fill-opacity="0.14" stroke="#4DD0E1" stroke-width="1.5"/>
<text x="358" y="160" text-anchor="middle" font-weight="600" fill="#4DD0E1">Direct session messages</text>
<text x="358" y="178" text-anchor="middle" font-size="11" fill="#8FA39B">same tool, both live</text>
<rect x="546" y="132" width="174" height="54" rx="14" fill="#F48FB1" fill-opacity="0.14" stroke="#F48FB1" stroke-width="1.5"/>
<text x="633" y="156" text-anchor="middle" font-weight="600" fill="#F48FB1">Hub sessions</text>
<text x="633" y="174" text-anchor="middle" font-size="11" fill="#8FA39B">mixed tools, ORC</text>
<rect x="494" y="224" width="214" height="54" rx="14" fill="#FF8A65" fill-opacity="0.14" stroke="#FF8A65" stroke-width="1.5"/>
<text x="601" y="248" text-anchor="middle" font-weight="600" fill="#FF8A65">File channel + driver loop</text>
<text x="601" y="266" text-anchor="middle" font-size="11" fill="#8FA39B">unattended, spend gates</text>
<rect x="378" y="318" width="198" height="54" rx="14" fill="#14B88A" fill-opacity="0.14" stroke="#14B88A" stroke-width="1.5"/>
<text x="477" y="342" text-anchor="middle" font-weight="600" fill="#14B88A">Git as the channel</text>
<text x="477" y="360" text-anchor="middle" font-size="11" fill="#8FA39B">branch, PR review, CI gate</text>
<rect x="668" y="318" width="194" height="54" rx="14" fill="#B39DDB" fill-opacity="0.14" stroke="#B39DDB" stroke-width="1.5"/>
<text x="765" y="342" text-anchor="middle" font-weight="600" fill="#B39DDB">Task board</text>
<text x="765" y="360" text-anchor="middle" font-size="11" fill="#8FA39B">many agents + humans, ORC</text>
<text x="866" y="460" text-anchor="end" font-size="11" fill="#8FA39B">patterns combine: most setups use two or three</text>
</svg>
