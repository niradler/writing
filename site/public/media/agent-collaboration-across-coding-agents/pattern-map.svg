<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif" role="img" font-size="13">
<rect width="900" height="460" rx="16" fill="#0E1412"/>
<text x="110" y="30" font-size="16" font-weight="600" fill="#DCE7E2">Six patterns for agent-to-agent work, by use case</text>
<line x1="110" y1="390" x2="860" y2="390" stroke="#8FA39B"/><line x1="110" y1="390" x2="110" y2="60" stroke="#8FA39B"/>
<text x="110" y="410" text-anchor="middle" fill="#8FA39B" font-size="12">minutes</text>
<text x="360" y="410" text-anchor="middle" fill="#8FA39B" font-size="12">an hour</text>
<text x="610" y="410" text-anchor="middle" fill="#8FA39B" font-size="12">hours</text>
<text x="860" y="410" text-anchor="middle" fill="#8FA39B" font-size="12">days</text>
<text x="485.0" y="434" text-anchor="middle" fill="#8FA39B">how long the work runs →</text>
<text x="100" y="394" text-anchor="end" fill="#8FA39B" font-size="12">hours</text>
<text x="100" y="229" text-anchor="end" fill="#8FA39B" font-size="12">minutes</text>
<text x="100" y="64" text-anchor="end" fill="#8FA39B" font-size="12">seconds</text>
<text x="30" y="225.0" text-anchor="middle" fill="#8FA39B" transform="rotate(-90 30 225.0)">how fast a decision must come back →</text>
<circle cx="170" cy="93" r="44" fill="#5AA9E6" opacity="0.12" stroke="#5AA9E6"/><text x="170" y="91" text-anchor="middle" font-weight="600" fill="#5AA9E6">Call and return</text><text x="170" y="108" text-anchor="middle" font-size="11" fill="#8FA39B">subagent, codex exec</text>
<circle cx="335" cy="142" r="44" fill="#4DD0E1" opacity="0.12" stroke="#4DD0E1"/><text x="335" y="140" text-anchor="middle" font-weight="600" fill="#4DD0E1">Direct session messages</text><text x="335" y="158" text-anchor="middle" font-size="11" fill="#8FA39B">same tool, both live</text>
<circle cx="575" cy="242" r="44" fill="#FF8A65" opacity="0.12" stroke="#FF8A65"/><text x="575" y="240" text-anchor="middle" font-weight="600" fill="#FF8A65">File channel + driver loop</text><text x="575" y="256" text-anchor="middle" font-size="11" fill="#8FA39B">unattended, spend gates</text>
<circle cx="485" cy="340" r="44" fill="#14B88A" opacity="0.12" stroke="#14B88A"/><text x="485" y="338" text-anchor="middle" font-weight="600" fill="#14B88A">Git as the channel</text><text x="485" y="356" text-anchor="middle" font-size="11" fill="#8FA39B">branch, PR review, CI gate</text>
<circle cx="770" cy="350" r="44" fill="#B39DDB" opacity="0.12" stroke="#B39DDB"/><text x="770" y="348" text-anchor="middle" font-weight="600" fill="#B39DDB">Task board</text><text x="770" y="365" text-anchor="middle" font-size="11" fill="#8FA39B">many agents + humans, ORC</text>
<circle cx="610" cy="155" r="48" fill="#F48FB1" opacity="0.12" stroke="#F48FB1"/><text x="610" y="153" text-anchor="middle" font-weight="600" fill="#F48FB1">Hub sessions</text><text x="610" y="170" text-anchor="middle" font-size="11" fill="#8FA39B">mixed tools, ORC</text><text x="860" y="452" text-anchor="end" font-size="11" fill="#8FA39B">patterns combine: most setups use two or three</text></svg>