<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="960" height="470" fill="#fff"/>
<text x="30" y="28" font-size="16" font-weight="600" fill="#222">The file protocol, one cycle: REPORT, then a QUESTION that pauses spend</text>
<rect x="30" y="170" width="190" height="80" rx="10" fill="#fff" stroke="#555" stroke-width="2"/><text x="125.0" y="206.0" text-anchor="middle" font-weight="600" font-size="14" fill="#222">Driver</text><text x="125.0" y="225.0" text-anchor="middle" font-size="11" fill="#666">cursor_driver.sh</text>
<rect x="300" y="50" width="240" height="80" rx="10" fill="#fff" stroke="#1565c0" stroke-width="2"/><text x="420.0" y="86.0" text-anchor="middle" font-weight="600" font-size="14" fill="#222">Executor</text><text x="420.0" y="105.0" text-anchor="middle" font-size="11" fill="#666">Cursor agent CLI, Gemini 4 Neon</text>
<rect x="740" y="170" width="190" height="80" rx="10" fill="#fff" stroke="#6a1b9a" stroke-width="2"/><text x="835.0" y="206.0" text-anchor="middle" font-weight="600" font-size="14" fill="#222">Supervisor</text><text x="835.0" y="225.0" text-anchor="middle" font-size="11" fill="#666">Claude Code</text>
<rect x="300" y="260" width="380" height="150" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="315" y="282" font-size="12" fill="#666">channel/ + STATUS.md (git)</text>
<text x="320" y="310" font-size="12" fill="#222" font-family="Menlo,monospace">to_claude.md   REPORT | QUESTION | BLOCKED | DONE</text>
<text x="320" y="338" font-size="12" fill="#222" font-family="Menlo,monospace">to_cursor.md   GUIDE | ANSWER  (+ ack: time)</text>
<text x="320" y="366" font-size="12" fill="#222" font-family="Menlo,monospace">STATUS.md      line 1: BLOCKED / DONE stops all</text>
<text x="320" y="394" font-size="12" fill="#222" font-family="Menlo,monospace">WAITING</text>
<circle cx="400" cy="389" r="8" fill="#ddd"/><circle cx="400" cy="389" r="8" fill="#ef6c00" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5286;0.5429;0.8571;0.8714;1" dur="14s" repeatCount="indefinite"/></circle>
<text x="415" y="394" font-size="12" fill="#ef6c00" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5286;0.5429;0.8571;0.8714;1" dur="14s" repeatCount="indefinite"/>driver paused, no spend</text>
<g stroke="#ccc" stroke-width="1.5" fill="none" stroke-dasharray="4 4"><path d="M220,200 L300,100"/><path d="M420,130 L420,295"/><path d="M680,305 L740,215"/><path d="M740,230 L680,333"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0107;0.0214;0.1714;0.1821;1" dur="14s" repeatCount="indefinite"/><circle r="9" fill="#555"><animateMotion path="M220,200 L300,100" dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0214;0.1286;1" calcMode="linear"/></circle><text x="160" y="140" fill="#555" font-weight="600" font-size="13">iteration N</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1464;0.1571;0.3143;0.325;1" dur="14s" repeatCount="indefinite"/><circle r="9" fill="#1565c0"><animateMotion path="M420,130 L420,300" dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1571;0.2714;1" calcMode="linear"/></circle><text x="430" y="220" fill="#1565c0" font-weight="600" font-size="13">REPORT</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2964;0.3071;0.4571;0.4679;1" dur="14s" repeatCount="indefinite"/><circle r="9" fill="#555"><animateMotion path="M220,200 L300,100" dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3071;0.4143;1" calcMode="linear"/></circle><text x="150" y="140" fill="#555" font-weight="600" font-size="13">iteration N+1</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4179;0.4286;0.5786;0.5893;1" dur="14s" repeatCount="indefinite"/><circle r="9" fill="#ef6c00"><animateMotion path="M420,130 L420,300" dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4286;0.5357;1" calcMode="linear"/></circle><text x="430" y="220" fill="#ef6c00" font-weight="600" font-size="13">QUESTION + touch WAITING</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.575;0.5857;0.7286;0.7393;1" dur="14s" repeatCount="indefinite"/><circle r="9" fill="#ef6c00"><animateMotion path="M680,305 L740,215" dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5857;0.6857;1" calcMode="linear"/></circle><text x="700" y="150" fill="#ef6c00" font-weight="600" font-size="13">watcher sees QUESTION</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7036;0.7143;0.8714;0.8821;1" dur="14s" repeatCount="indefinite"/><circle r="9" fill="#6a1b9a"><animateMotion path="M740,230 L680,333" dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.7143;0.8286;1" calcMode="linear"/></circle><text x="700" y="445" fill="#6a1b9a" font-weight="600" font-size="13">verify, ANSWER, rm WAITING</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8607;0.8714;1.0071;1.0071;1.0071" dur="14s" repeatCount="indefinite"/><circle r="9" fill="#555"><animateMotion path="M220,200 L300,100" dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.8714;0.9643;1" calcMode="linear"/></circle><text x="140" y="140" fill="#555" font-weight="600" font-size="13">N+2: ack: ANSWER</text></g>
<text x="30" y="458" font-size="13" fill="#222" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.0;0.1286;0.1429;1" dur="14s" repeatCount="indefinite"/>Driver starts one executor run with the same prompt file</text>
<text x="30" y="458" font-size="13" fill="#222" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1286;0.1429;0.2714;0.2857;1" dur="14s" repeatCount="indefinite"/>Executor does one step, appends a REPORT, commits</text>
<text x="30" y="458" font-size="13" fill="#222" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2714;0.2857;0.4143;0.4286;1" dur="14s" repeatCount="indefinite"/>Next iteration; supervisor ignores REPORTs (no tokens spent)</text>
<text x="30" y="458" font-size="13" fill="#222" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4143;0.4286;0.5571;0.5714;1" dur="14s" repeatCount="indefinite"/>Spend ahead: QUESTION with options and a pick, then WAITING</text>
<text x="30" y="458" font-size="13" fill="#222" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5571;0.5714;0.7;0.7143;1" dur="14s" repeatCount="indefinite"/>Driver sleeps while WAITING exists; supervisor wakes on QUESTION</text>
<text x="30" y="458" font-size="13" fill="#222" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.7143;0.8429;0.8571;1" dur="14s" repeatCount="indefinite"/>Supervisor recounts from the raw log, answers, removes WAITING</text>
<text x="30" y="458" font-size="13" fill="#222" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8429;0.8571;0.9857;1.0;1" dur="14s" repeatCount="indefinite"/>Executor acknowledges the ANSWER and spends</text>
</svg>