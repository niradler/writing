name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npm run check:built
      - run: npx --yes playwright@1.55.0 install --with-deps chromium
      - run: npm run check:layout
      - run: npm run build:production
      - run: SITE_TARGET=production npm run check:built
